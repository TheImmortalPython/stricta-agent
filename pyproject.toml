[project]
name = "stricta"
version = "0.3.0"
description = "Deterministic agent control plane with Pāṇinian Kāraka role progression, logit containment, ShadowCritic validation, StepSnapshot rollback, and JSONL/SQLite ledger parity."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
